{% extends "pages/base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<div class="card narrow"><h1>Choose a new password</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" autocomplete="off">{% csrf_token %}
<label>New password<input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
<label>Repeat new password<input type="password" name="password2" minlength="8" required autocomplete="new-password"></label>
<p class="hint">At least 8 characters. Avoid common passwords and all-number passwords.</p>
<button class="btn" type="submit">Save new password</button></form></div>
{% endblock %}
